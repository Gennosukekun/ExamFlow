name: Build ExamFlow v6.9 Two Column Home

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract stable v6.8
        run: |
          rm -rf examflow-build
          mkdir -p examflow-build
          unzip -q ExamFlow_Italia_Android_Project_More_Features_v6_8_Natural_Scroll.zip -d examflow-build
      - name: Inspect Home markup
        run: |
          echo '=== HOME MARKUP ==='
          grep -n -C 10 -E 'Quiz AI|Ripasso|Focus|Flashcard|Sfide' examflow-build/app/src/main/assets/index.html || true
          echo '=== RELEVANT CSS ==='
          grep -n -C 3 -E 'feature|card|home|grid|action' examflow-build/app/src/main/assets/styles.css | head -400 || true
      - name: Force two-column Home cards
        run: |
          CSS='@media(max-width:900px){.featureGrid,.feature-grid,.homeGrid,.home-grid,#home .grid,#home .cards,#home .features,[data-page="home"] .grid,[data-page="home"] .cards,[data-page="home"] .features{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.featureGrid>*,.feature-grid>*,.homeGrid>*,.home-grid>*,#home .grid>*,#home .cards>*,#home .features>*,[data-page="home"] .grid>*,[data-page="home"] .cards>*,[data-page="home"] .features>*{width:100%!important;min-width:0!important;margin-left:0!important;margin-right:0!important;box-sizing:border-box!important}}'
          printf '\n%s\n' "$CSS" >> examflow-build/app/src/main/assets/styles.css
      - name: Build v6.9 debug APK
        working-directory: examflow-build
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamFlow-Italia-v6.9-Two-Column-Home-APK
          path: examflow-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
