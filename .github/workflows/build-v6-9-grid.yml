name: Build ExamFlow v6.9 Two Column Home

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract stable v6.8
        run: |
          rm -rf examflow-build
          mkdir -p examflow-build
          unzip -q ExamFlow_Italia_Android_Project_More_Features_v6_8_Natural_Scroll.zip -d examflow-build
      - name: Apply exact two-column Home layout
        run: |
          printf '\n/* ExamFlow v6.9: force Home cards to 2 columns on phones */\n.quick-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.quick-grid>.quick{width:100%!important;min-width:0!important;box-sizing:border-box!important;padding:14px 10px!important}.quick-grid>.quick b{font-size:14px!important}.quick-grid>.quick small{font-size:11px!important}.quick-grid>.quick span{margin-bottom:8px!important}\n@media(max-width:370px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}\n' >> examflow-build/app/src/main/assets/styles.css
          tail -8 examflow-build/app/src/main/assets/styles.css
      - name: Build v6.9 debug APK
        working-directory: examflow-build
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamFlow-Italia-v6.9-Two-Column-Home-APK
          path: examflow-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
