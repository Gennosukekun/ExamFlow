name: Build ExamFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "ExamFlow_Italia_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          rm -rf examflow-build
          mkdir examflow-build
          unzip -q ExamFlow_Italia_Android_Project.zip -d examflow-build

      - name: Build debug APK
        working-directory: examflow-build
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamFlow-Italia-APK
          path: examflow-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
